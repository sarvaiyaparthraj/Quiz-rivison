<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz Application</title>

  <link rel="stylesheet" href="style.css">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <div class="container d-flex justify-content-center align-items-center min-vh-100">

    <div class="card shadow-lg p-4" style="max-width:700px; width:100%;">

      <h2 class="text-center mb-3">
        Quiz Application
      </h2>

      <div class="d-flex justify-content-between fs-4">
        <p id="qns" class="text-primary">
          Qns 1/10
        </p>

        <p id="timer" class="text-danger">
          Time : 30s
        </p>
      </div>

      <h4 id="showQuestion" class="text-center my-4">
        Question
      </h4>

      <div id="option" class="d-grid gap-3">
   
      </div>

      <div class="text-center mt-4">
        <button id="nextBtn" class="btn btn-danger">
          Next
        </button>
      </div>

    </div>

  </div>

  <script src="./script.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
